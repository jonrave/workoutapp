# Oura readiness-gate sync.
#
# Oura does not expose overnight data in real time, so this targets a morning
# window in America/New_York. Actions cron is UTC and the New York offset
# shifts across daylight saving (UTC-4 in summer, UTC-5 in winter), so two
# cron entries cover both regimes: whichever lands at 07:30 local is the
# intended one, and no cron edits are needed in March or November.
#
# Both entries run the sync unconditionally. An earlier version skipped runs
# that fell outside the 07:xx local hour, but GitHub delivers schedule events
# late, sometimes by many hours, and that guard turned "late run" into "no
# run today" (observed 2026-08-27/28: fires arrived ~10h late and were
# skipped). A late pull beats a skipped day: the ingest is idempotent, the
# artifacts are regenerated in full each run, and the concurrency group
# serializes overlapping fires, so double or late runs are safe by design.
name: Oura gate sync

on:
  schedule:
    - cron: '30 11 * * *' # 07:30 America/New_York while on EDT (UTC-4)
    - cron: '30 12 * * *' # 07:30 America/New_York while on EST (UTC-5)
  workflow_dispatch: {}

# Never overlap runs: a concurrent pair could interleave a token refresh and
# persist a dead single-use refresh token.
concurrency:
  group: oura-gate-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Log delivery time (schedule events often arrive late)
        run: echo "Fired at $(date -u +%FT%TZ), America/New_York $(TZ=America/New_York date +%H:%M)."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Oura data, write artifacts, ingest events
        env:
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/oura-gate-sync.ts

      - name: Commit regenerated artifacts
        run: |
          git config user.name "oura-gate-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/oura
          if git diff --cached --quiet; then
            echo "Artifacts unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate Oura gate artifacts"
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            git pull --rebase origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
          done
          echo "Failed to push artifacts after retries."
          exit 1
